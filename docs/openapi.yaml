openapi: 3.1.0
info:
  title: EBA Data Explorer
  description: 'EBA Data Explorer API. Modules: **ingest** (upload and staging), **processing**
    (staging analysis and validation), **public-analysis** (analysis and chart data
    for promoted facts). Errors are `application/problem+json` (RFC 9457); long operations
    are jobs processed by `python -m app.worker`.'
  version: '0.2'
paths:
  /api/health:
    get:
      tags:
      - system
      summary: Is the application usable?
      description: Database reachability and queue state. `worker_hint` tells the
        interface to warn the user that the worker process is not running.
      operationId: get_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/meta:
    get:
      tags:
      - system
      summary: Enumerations and error types for the client
      operationId: get_meta
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
  /api/jobs/{job_id}:
    get:
      tags:
      - system
      summary: State of any job
      description: 'Generic polling endpoint: works for every job kind of every module.'
      operationId: get_job
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfo'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/imports/{import_id}/jobs:
    get:
      tags:
      - system
      summary: Every job of an import, newest first
      operationId: list_import_jobs
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: integer
          title: Import Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobInfo'
                title: Response List Import Jobs
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/config:
    get:
      tags:
      - ingest
      summary: Upload limits
      description: 'What the interface needs before offering an upload: the size limit
        and the accepted extensions.'
      operationId: get_ingest_config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestConfig'
  /api/imports:
    get:
      tags:
      - ingest
      summary: List imports, newest first
      operationId: list_imports
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ImportSummary'
                type: array
                title: Response List Imports
    post:
      tags:
      - ingest
      summary: Upload the original files of one import
      description: 'Stores the files untouched (sha256, read-only), registers the
        import and queues the loading job.

        The answer is immediate: poll `GET /api/imports/{id}` until `job_status` is
        `completed` or `failed`.'
      operationId: create_import
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_import'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDetail'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema: *id001
        '413':
          description: Payload too large
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/imports/{import_id}:
    get:
      tags:
      - ingest
      summary: Report and live state of one import
      operationId: get_import
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: integer
          title: Import Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDetail'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/imports/{import_id}/staging:
    delete:
      tags:
      - ingest
      summary: Drop the staging tables of an import
      description: The stored original files are never touched.
      operationId: drop_staging
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: integer
          title: Import Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DroppedStaging'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/imports/{import_id}/load:
    post:
      tags:
      - ingest
      summary: Queue promotion of a validated import into public tables
      operationId: queue_load
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: integer
          title: Import Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadQueued'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/processing/config:
    get:
      tags:
      - processing
      summary: Limits, enumerations and the validation rules
      description: 'Everything the interface needs to build its controls without hard-coding:
        limits, allowed values and the rule catalogue.'
      operationId: get_processing_config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingConfig'
  /api/imports/{import_id}/datasets:
    get:
      tags:
      - processing
      summary: Staged data files of an import
      description: 'One entry per data file whose staging table still exists: columns
        with roles, rows and the periods found.

        Empty when the staging tables were dropped.'
      operationId: list_datasets
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: integer
          title: Import Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSummary'
                title: Response List Datasets
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/datasets/{file_id}:
    get:
      tags:
      - processing
      summary: One staged data file
      operationId: get_dataset
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSummary'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/datasets/{file_id}/preview:
    get:
      tags:
      - processing
      summary: A page of rows
      description: Rows exactly as loaded (all text). Filters combine with AND; unknown
        columns are refused with the list of valid ones.
      operationId: preview_dataset
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          title: File Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Page Size
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Column to sort by (amount sorts numerically)
          title: Sort
        description: Column to sort by (amount sorts numerically)
      - name: order
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          default: asc
          title: Order
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: 'null'
          description: Period as in the file, YYYYMM
          examples:
          - '202006'
          title: Period
        description: Period as in the file, YYYYMM
      - name: lei
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Lei
      - name: item
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Item
      - name: dim
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Dimension filter column:value, repeatable (e.g. perf_status:2)
          title: Dim
        description: Dimension filter column:value, repeatable (e.g. perf_status:2)
      - name: exclude_aggregate
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Exclude Aggregate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewPage'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
        '504':
          description: Error
          content:
            application/problem+json:
              schema: *id001
  /api/datasets/{file_id}/items:
    get:
      tags:
      - processing
      summary: Catalogue of items with null and label checks
      description: The list the interface needs to fill the item selectors of the
        histogram and the scatter plot.
      operationId: list_items
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          title: File Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search in item code and label
          title: Q
        description: Search in item code and label
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Page Size
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: 'null'
          description: Period as in the file, YYYYMM
          examples:
          - '202006'
          title: Period
        description: Period as in the file, YYYYMM
      - name: exclude_aggregate
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Exclude Aggregate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
        '504':
          description: Error
          content:
            application/problem+json:
              schema: *id001
  /api/datasets/{file_id}/profile:
    get:
      tags:
      - processing
      summary: 'Per-column profile: nulls, distinct values, top values'
      operationId: profile_dataset
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          title: File Id
      - name: distinct
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Distinct
      - name: top
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 0
          default: 5
          title: Top
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: 'null'
          description: Period as in the file, YYYYMM
          examples:
          - '202006'
          title: Period
        description: Period as in the file, YYYYMM
      - name: exclude_aggregate
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Exclude Aggregate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
        '504':
          description: Error
          content:
            application/problem+json:
              schema: *id001
  /api/datasets/{file_id}/nulls:
    get:
      tags:
      - processing
      summary: Null analysis by period or by item
      operationId: nulls_dataset
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          title: File Id
      - name: by
        in: query
        required: false
        schema:
          type: string
          pattern: ^(period|item)$
          description: 'period: a matrix of nulls per column and period; item: the
            items with the most empty amounts'
          default: period
          title: By
        description: 'period: a matrix of nulls per column and period; item: the items
          with the most empty amounts'
      - name: columns
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Columns to count (by=period); default all
          title: Columns
        description: Columns to count (by=period); default all
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          title: Limit
      - name: exclude_aggregate
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Exclude Aggregate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullAnalysis'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
        '504':
          description: Error
          content:
            application/problem+json:
              schema: *id001
  /api/datasets/{file_id}/histogram:
    get:
      tags:
      - processing
      summary: Distribution of the amounts of one item
      description: Equal-width (or logarithmic) bins with summary statistics. `clip`
        hides the tails from the bins but still counts them in `outside`.
      operationId: histogram_dataset
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          title: File Id
      - name: item
        in: query
        required: true
        schema:
          type: string
          description: Item code (see /items)
          title: Item
        description: Item code (see /items)
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: 'null'
          description: Period as in the file, YYYYMM
          examples:
          - '202006'
          title: Period
        description: Period as in the file, YYYYMM
      - name: bins
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 30
          title: Bins
      - name: scale
        in: query
        required: false
        schema:
          type: string
          pattern: ^(linear|log)$
          default: linear
          title: Scale
      - name: clip
        in: query
        required: false
        schema:
          type: string
          pattern: ^(none|p01-p99|iqr)$
          default: none
          title: Clip
      - name: dim
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Dimension filter column:value, repeatable (e.g. perf_status:2)
          title: Dim
        description: Dimension filter column:value, repeatable (e.g. perf_status:2)
      - name: exclude_aggregate
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Exclude Aggregate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistogramResponse'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
        '504':
          description: Error
          content:
            application/problem+json:
              schema: *id001
  /api/datasets/{file_id}/scatter:
    get:
      tags:
      - processing
      summary: One value per bank for two (item, period) choices
      description: 'Pairs the two values by bank (LEI). Use two items in one period
        to relate indicators, or one item in two periods to see change.

        `n_pairs` is always the full number; when it exceeds `max_points` a reproducible
        sample is returned and `sampled` is true.'
      operationId: scatter_dataset
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          title: File Id
      - name: x_item
        in: query
        required: true
        schema:
          type: string
          title: X Item
      - name: y_item
        in: query
        required: true
        schema:
          type: string
          title: Y Item
      - name: x_period
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{6}$
          title: X Period
      - name: y_period
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9]{6}$
          title: Y Period
      - name: agg
        in: query
        required: false
        schema:
          type: string
          pattern: ^(single|sum|mean|min|max)$
          description: How to combine several rows of a bank (single refuses them)
          default: single
          title: Agg
        description: How to combine several rows of a bank (single refuses them)
      - name: dim
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Dimension filter column:value, repeatable (e.g. perf_status:2)
          title: Dim
        description: Dimension filter column:value, repeatable (e.g. perf_status:2)
      - name: max_points
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 10
          default: 2000
          title: Max Points
      - name: exclude_aggregate
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Exclude Aggregate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScatterResponse'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
        '504':
          description: Error
          content:
            application/problem+json:
              schema: *id001
  /api/imports/{import_id}/validation:
    post:
      tags:
      - processing
      summary: Queue the validation of a staged import
      description: Runs the rule catalogue (see /api/processing/config) in the worker.
        Poll `GET` of the same path. Idempotent while a run is waiting or running.
      operationId: queue_validation
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: integer
          title: Import Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationQueued'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
    get:
      tags:
      - processing
      summary: State and latest report of the validation
      description: '`job` is the latest validation job (null if never queued), `report`
        the latest finished report (null until one exists).

        A report without errors moves the import to `validated`.'
      operationId: get_validation
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: integer
          title: Import Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationState'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/public/periods:
    get:
      tags:
      - public-analysis
      summary: List active public periods
      operationId: list_public_analysis_periods
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicPeriod'
                type: array
                title: Response List Public Analysis Periods
  /api/public/versions/{version_id}/datasets/{dataset}/preview:
    get:
      tags:
      - public-analysis
      summary: Preview promoted public data
      operationId: preview_public_analysis
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: integer
          title: Version Id
      - name: dataset
        in: path
        required: true
        schema:
          enum:
          - oth
          - cre
          - mrk
          - sov
          - tr_oth
          - tr_cre
          - tr_mrk
          - tr_sov
          type: string
          description: Public dataset or tr_ alias
          title: Dataset
        description: Public dataset or tr_ alias
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/public/versions/{version_id}/datasets/{dataset}/profile:
    get:
      tags:
      - public-analysis
      summary: Profile promoted public data
      operationId: profile_public_analysis
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
