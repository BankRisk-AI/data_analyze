          description: False when a validation was already waiting or running and
            that job is returned
      type: object
      required:
      - job_id
      - status
      - created
      title: ValidationQueued
    ValidationReportModel:
      properties:
        import_id:
          type: integer
          title: Import Id
        generated_at:
          type: string
          title: Generated At
        seconds:
          type: number
          title: Seconds
        summary:
          $ref: '#/components/schemas/ValidationSummary'
        files:
          items:
            $ref: '#/components/schemas/FileValidationModel'
          type: array
          title: Files
      type: object
      required:
      - import_id
      - generated_at
      - seconds
      - summary
      - files
      title: ValidationReportModel
    ValidationState:
      properties:
        import_id:
          type: integer
          title: Import Id
        import_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Import Status
        job:
          anyOf:
          - $ref: '#/components/schemas/ValidationJob'
          - type: 'null'
        report:
          anyOf:
          - $ref: '#/components/schemas/ValidationReportModel'
          - type: 'null'
      type: object
      required:
      - import_id
      title: ValidationState
    ValidationSummary:
      properties:
        errors:
          type: integer
          title: Errors
        warnings:
          type: integer
          title: Warnings
        infos:
          type: integer
          title: Infos
        can_proceed:
          type: boolean
          title: Can Proceed
          description: True when no rule of severity error failed
      type: object
      required:
      - errors
      - warnings
      - infos
      - can_proceed
      title: ValidationSummary
    ValueRange:
      properties:
        lo:
          type: number
          title: Lo
        hi:
          type: number
          title: Hi
      type: object
      required:
      - lo
      - hi
      title: ValueRange
tags:
- name: system
  description: Health, enumerations and the state of any job.
- name: ingest
  description: Upload of the original files, import list and report, staging tables.
- name: processing
  description: Preview, profile, null analysis, distribution and scatter charts, and
    validation of staged data.
- name: public-analysis
  description: Analysis and chart-ready data from public facts and mirror views.
- name: ml
  description: Machine-learning datasets, experiments, models and predictions.
