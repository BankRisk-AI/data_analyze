          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: *id001
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema: *id001
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
  /api/ml/predictions:
    get:
      tags:
      - ml
      summary: List ML predictions
      operationId: list_ml_predictions
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      - name: champion_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Champion Only
      - name: threshold_setting
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Threshold Setting
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPredictions'
        '422':
          description: Invalid request or parameter
          content:
            application/problem+json:
              schema: *id001
